version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bass_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d bass_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app/temp_uploads:/app/app/temp_uploads
      - ./outputs:/app/outputs
      - ./crepe_cache:/root/.cache/torchcrepe
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/bass_db
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    volumes:
      - ./app/temp_uploads:/app/app/temp_uploads
      - ./outputs:/app/outputs
      - ./crepe_cache:/root/.cache/torchcrepe
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/bass_db
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --loglevel=info --pool=solo

volumes:
  postgres_data:
